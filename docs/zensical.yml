site_name: gdsfactoryx
site_description: A differentiable JAX port of gdsfactory, with direct fdtdx integration
repo_url: https://github.com/Sephiram591/gdsfactoryx
repo_name: Sephiram591/gdsfactoryx
site_url: https://sephiram591.github.io/gdsfactoryx/
docs_dir: .
site_dir: _build/html

nav:
  - Home: index.md
  - Differentiable layouts: differentiable.md
  - FDTD with fdtdx: fdtdx.md
  - API reference: api.md
  - gdsfactory docs: https://gdsfactory.github.io/gdsfactory/

theme:
  name: material
  logo: logo.png
  favicon: logo.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: ["..", "."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      enabled: true
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google
            separate_signature: true
            show_signature_annotations: true
            members_order: alphabetical
            show_root_heading: true
            show_root_full_path: false
  - autorefs
