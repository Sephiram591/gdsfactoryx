name: Publish to PyPI

# Runs only when a version tag (v*) is pushed. The publish job waits for approval
# on the "pypi" environment, so nothing is uploaded until a required reviewer approves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check tag matches project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag: $TAG, pyproject.toml version: $version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error file=pyproject.toml::tag $TAG does not match project version v$version"
            exit 1
          fi
          case "$version" in
            *dev*)
              echo "::error file=pyproject.toml::refusing to publish dev release $version to PyPI"
              exit 1
              ;;
          esac

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gdsfactoryx
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
